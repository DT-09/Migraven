name: Release packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: build/verity
          - os: windows-latest
            platform: windows-x64
            binary: build/Release/verity.exe
          - os: macos-latest
            platform: macos-arm64
            binary: build/verity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build -DVERITY_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Assemble release bundle
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python tools/package_release.py --binary "${{ matrix.binary }}" --version "$VERSION" --platform "${{ matrix.platform }}" --output-dir dist
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: verity-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: verity-*
          path: release-assets
          merge-multiple: true
      - name: Create release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --title "Verity $GITHUB_REF_NAME" --generate-notes
