name: Verity CI

on:
  push:
    branches: [main, "productization/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / GCC
            os: ubuntu-latest
            cc: gcc
          - name: Ubuntu / Clang
            os: ubuntu-latest
            cc: clang
          - name: Windows / MSVC
            os: windows-latest
            cc: ""
          - name: macOS / Clang
            os: macos-latest
            cc: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.cc }}" != "" ]; then
            CC="${{ matrix.cc }}" cmake -S . -B build -DVERITY_BUILD_TESTS=ON
          else
            cmake -S . -B build -DVERITY_BUILD_TESTS=ON
          fi
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
